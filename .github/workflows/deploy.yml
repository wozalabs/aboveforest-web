# Builds the site and publishes it to GitHub Pages on every push to main (or by hand from the
# Actions tab). In the repository settings, Pages > Source must be "GitHub Actions".
#
# The site is served from https://wozalabs.github.io/aboveforest-web/, so it is built with that
# base path. For a custom domain, set SITE_URL to the domain and SITE_BASE to "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://wozalabs.github.io
          SITE_BASE: /aboveforest-web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
